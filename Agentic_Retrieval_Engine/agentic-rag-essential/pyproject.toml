[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-platform"
version = "1.0.0"
description = "Production-oriented multi-tool Agentic RAG orchestration platform"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
